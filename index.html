<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Domains for sale</title>
  <meta name="description" content="These domains are for sale.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600&family=Inter:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --celeste: #74acdf;
      --celeste-deep: #1d5c96;
      --celeste-mid: #4f90cc;
      --white: #ffffff;
      --sol: #f6b40e;
      --sol-ink: #85340a;      --card-top: #ffffff;
      --card-bottom: #f1f6fb;

      --cell-w: clamp(16px, 3.1vw, 48px);
      --cell-h: calc(var(--cell-w) * 1.45);
      --cell-gap: clamp(2px, 0.35vw, 5px);
      --radius: calc(var(--cell-w) * 0.12);
    }

    * { box-sizing: border-box; margin: 0; }

    html, body { height: 100%; }

    body {
      background: var(--celeste);
      color: var(--white);
      font-family: Inter, system-ui, sans-serif;
      -webkit-font-smoothing: antialiased;
      overflow-x: hidden;
    }

    /* Blurred photo of the islands, tinted with the flag's celeste */
    body::before,
    body::after {
      content: "";
      position: fixed;
      inset: 0;
      z-index: -1;
    }
    body::before {
      background: url("assets/bg.jpg") center / cover no-repeat;
      filter: blur(5px) saturate(1.1);
      transform: scale(1.05);
    }
    body::after {
      background:
        linear-gradient(to bottom,
          rgba(116, 172, 223, 0.78) 0%,
          rgba(116, 172, 223, 0.45) 38%,
          rgba(255, 255, 255, 0.28) 50%,
          rgba(116, 172, 223, 0.55) 62%,
          rgba(116, 172, 223, 0.9) 100%);
    }

    main {
      min-height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 48px 16px;
      gap: 32px;
    }

    /* ---------- Split-flap board ---------- */

    .board {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      row-gap: calc(var(--cell-gap) * 3);
      perspective: 900px;
      font-family: "Barlow Condensed", "Arial Narrow", sans-serif;
      font-weight: 600;
      font-size: calc(var(--cell-w) * 1.05);
      filter: drop-shadow(0 10px 24px rgba(29, 92, 150, 0.25));
    }

    /* Words never break across lines; on narrow screens the board wraps between words */
    .word { display: flex; }
    .word:nth-child(odd)  { color: var(--celeste-deep); }
    .word:nth-child(even) { color: var(--celeste-mid); }

    .cell {
      position: relative;
      width: var(--cell-w);
      height: var(--cell-h);
      margin: 0 calc(var(--cell-gap) / 2);
      transition: width 0.35s ease, margin 0.35s ease, opacity 0.35s ease;
    }
    .cell.blank {
      width: 0;
      margin: 0;
      opacity: 0;
    }

    /* Hinge line across the middle */
    .cell::after {
      content: "";
      position: absolute;
      left: 0; right: 0;
      top: 50%;
      height: 1px;
      transform: translateY(-0.5px);
      background: rgba(29, 92, 150, 0.18);
      z-index: 5;
    }

    .half {
      position: absolute;
      left: 0; right: 0;
      height: 50%;
      overflow: hidden;
      backface-visibility: hidden;
    }
    .half > span {
      position: absolute;
      left: 0; right: 0;
      height: var(--cell-h);
      line-height: var(--cell-h);
      text-align: center;
    }

    .top, .flip-top {
      top: 0;
      background: var(--card-top);
      border-radius: var(--radius) var(--radius) 0 0;
      transform-origin: bottom;
    }
    .top > span, .flip-top > span { top: 0; }

    .bottom, .flip-bottom {
      bottom: 0;
      background: var(--card-bottom);
      border-radius: 0 0 var(--radius) var(--radius);
      transform-origin: top;
    }
    .bottom > span, .flip-bottom > span { bottom: 0; }

    .flip-top, .flip-bottom { z-index: 2; visibility: hidden; }
    .flip-bottom { transform: rotateX(90deg); }

    .cell.flipping .flip-top {
      visibility: visible;
      animation: fold-top var(--flip-ms) ease-in forwards;
    }
    .cell.flipping .flip-bottom {
      visibility: visible;
      animation: fold-bottom var(--flip-ms) ease-out var(--flip-ms) forwards;
    }

    @keyframes fold-top {
      from { transform: rotateX(0deg); filter: brightness(1); }
      to   { transform: rotateX(-90deg); filter: brightness(0.8); }
    }
    @keyframes fold-bottom {
      from { transform: rotateX(90deg); filter: brightness(0.9); }
      to   { transform: rotateX(0deg); filter: brightness(1); }
    }

    /* ---------- Copy + action ---------- */

    .lede {
      font-size: clamp(15px, 1.8vw, 18px);
      letter-spacing: 0.02em;
      text-shadow: 0 1px 12px rgba(29, 92, 150, 0.35);
    }

    /* Sol de Mayo button */
    .btn {
      display: inline-flex;
      align-items: center;
      gap: 9px;
      padding: 9px 22px 9px 12px;
      border-radius: 999px;
      background: var(--sol);
      color: var(--white);
      text-shadow: 0 1px 2px rgba(133, 52, 10, 0.35);
      font-size: 12px;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      text-decoration: none;
      box-shadow: 0 4px 12px rgba(29, 92, 150, 0.18);
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }
    .btn svg {
      width: 20px;
      height: 20px;
      flex: none;
      color: var(--sol-ink);
      transition: transform 0.8s cubic-bezier(0.2, 0.7, 0.2, 1);
    }
    .btn:hover {
      transform: translateY(-1px);
      box-shadow:
        0 0 0 5px rgba(246, 180, 14, 0.25),
        0 8px 20px rgba(29, 92, 150, 0.22);
    }
    .btn:hover svg { transform: rotate(90deg); }
    .btn:focus-visible {
      outline: 2px solid var(--white);
      outline-offset: 4px;
    }

    @media (max-width: 700px) {
      :root {
        --cell-w: 7vw;
        --cell-gap: 2px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .cell { transition: none; }
    }
  </style>
</head>
<body>
  <main>
    <h1 class="board" id="board"></h1>
    <p class="lede">These domains are for sale.</p>
    <a class="btn" id="contact">
      <svg viewBox="-12 -12 24 24" aria-hidden="true">
        <g stroke="currentColor" stroke-linecap="round" stroke-width="1.3">
          <path d="M0-11.5V11.5M-11.5 0H11.5M-8.1-8.1L8.1 8.1M8.1-8.1L-8.1 8.1"/>
          <path d="M-3.6-8.7L3.6 8.7M3.6-8.7L-3.6 8.7M-8.7-3.6L8.7 3.6M8.7-3.6L-8.7 3.6" opacity="0.7"/>
        </g>
        <circle r="5" fill="var(--sol)" stroke="currentColor" stroke-width="1.3"/>
      </svg>
      Contact
    </a>
  </main>

  <script>
    // ---- Config: edit these ----
    // Spaces mark word breaks (for readability and mobile wrapping); they're stripped from the domain.
    const DOMAINS = ['the malvinas are not from the .uk', 'malvinas are not from the .uk'];
    const CONTACT_EMAIL = 'verasergio@icloud.com';
    const HOLD_MS = 3500;          // how long each domain stays on screen
    // ----------------------------

    const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    const SPIN_CHARS = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ';
    const strip = d => d.replace(/\s+/g, '');
    const names = DOMAINS.map(strip);
    const longest = DOMAINS.reduce((a, b) => strip(b).length > strip(a).length ? b : a);
    const width = strip(longest).length;
    // Right-align so the shared ending (".uk") stays put and only the front changes
    const pad = d => strip(d).toUpperCase().padStart(width, ' ');

    document.getElementById('contact').href =
      `mailto:${CONTACT_EMAIL}?subject=${encodeURIComponent('Domains: ' + names.join(' / '))}`;

    // Build the board: one .word group per word of the longest domain
    const board = document.getElementById('board');
    board.setAttribute('aria-label', names.join(' / '));

    function makeCell(ch) {
      const cell = document.createElement('span');
      cell.className = 'cell';
      cell.setAttribute('aria-hidden', 'true');
      cell.innerHTML = ['top', 'bottom', 'flip-top', 'flip-bottom']
        .map(c => `<span class="half ${c}"><span></span></span>`).join('');
      const [top, bottom, flipTop, flipBottom] = cell.querySelectorAll('.half > span');
      cell._parts = { top, bottom, flipTop, flipBottom };
      setChar(cell, ch);
      return cell;
    }

    function setChar(cell, ch) {
      const p = cell._parts;
      p.top.textContent = p.bottom.textContent = ch;
      cell._char = ch;
      cell.classList.toggle('blank', ch === ' ');
    }

    const first = [...pad(DOMAINS[0])];
    const cells = [];
    for (const word of longest.trim().split(/\s+/)) {
      const group = document.createElement('span');
      group.className = 'word';
      for (let i = 0; i < word.length; i++) {
        const cell = makeCell(first[cells.length]);
        cells.push(cell);
        group.append(cell);
      }
      board.append(group);
    }

    // One physical flap: the top half of the old char folds down, revealing the new top;
    // then the bottom half of the new char falls over the old bottom.
    function flip(cell, to, ms) {
      return new Promise(resolve => {
        const p = cell._parts;
        const from = cell._char;
        p.top.textContent = to;
        p.bottom.textContent = from;
        p.flipTop.textContent = from;
        p.flipBottom.textContent = to;
        cell.style.setProperty('--flip-ms', ms + 'ms');
        cell.classList.remove('flipping');
        void cell.offsetWidth; // restart animation
        cell.classList.add('flipping');
        setTimeout(() => {
          cell.classList.remove('flipping');
          p.bottom.textContent = to;
          cell._char = to;
          resolve();
        }, ms * 2);
      });
    }

    const wait = ms => new Promise(r => setTimeout(r, ms));
    const randomChar = () => SPIN_CHARS[Math.floor(Math.random() * SPIN_CHARS.length)];

    async function spinTo(cell, target, delay) {
      await wait(delay);
      if (target !== ' ') cell.classList.remove('blank');        // expand before flipping in
      if (cell._char === ' ') cell._char = '';
      const spins = 3 + Math.floor(Math.random() * 3);
      for (let i = 0; i < spins; i++) await flip(cell, randomChar(), 45);
      await flip(cell, target === ' ' ? '' : target, 90);
      setChar(cell, target);                                     // collapse if now blank
    }

    async function show(domain) {
      const chars = [...pad(domain)];
      if (reduceMotion) {
        chars.forEach((ch, i) => setChar(cells[i], ch));
        return;
      }
      let k = 0;
      await Promise.all(chars.map((ch, i) =>
        cells[i]._char === ch ? null : spinTo(cells[i], ch, (k++) * 60)
      ));
    }

    async function loop() {
      let i = 0;
      while (true) {
        await wait(HOLD_MS);
        if (document.hidden) continue;
        i = (i + 1) % DOMAINS.length;
        await show(DOMAINS[i]);
      }
    }
    if (DOMAINS.length > 1) loop();
  </script>
</body>
</html>
